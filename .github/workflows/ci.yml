name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup node with pnpm
        uses: pnpm/setup@v3
        with:
          install: false
          node-version-file: .nvmrc
          cache: true
      - name: pnpm audit
        run: pnpm audit --audit-level=high

  check-format:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup node with pnpm
        uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
      - name: check format and types
        run: make check

  playwright:
    timeout-minutes: 6
    runs-on: ubuntu-latest
    env:
      PUBLIC_HIGHLIGHTS_API_URL: ${{ vars.PUBLIC_HIGHLIGHTS_API_URL }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup node with pnpm
        uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
      - name: install browsers
        run: pnpx playwright install --with-deps
      # Required to build the project for Playwright tests
      - name: log in to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: run tests
        run: pnpm playwright
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-artifacts
          path: |
            test/browser/artifacts/
            !test/browser/artifacts/.last-run.json
            test/browser/report/
          retention-days: 1

  vitest:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup node with pnpm
        uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
      - name: run tests
        run: pnpm vitest
